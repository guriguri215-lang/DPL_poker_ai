# River board-texture clusters -- frozen MVP taxonomy (Q4, ADR-0016).
#
# `state_cluster` is the single board-texture key shared by base-strategy
# lookup, leak detection and node-lock matching (REV-20260702 H-9). To keep the
# key stable it is defined here as data, not code: the classifier computes a
# fixed vocabulary of board features and applies these rules top to bottom,
# returning the first match. The final rule has an empty `when` and therefore
# always matches, so every board maps to exactly one cluster (total coverage);
# first-match ordering makes the mapping exclusive.
#
# The six cluster names come from Poker AI Specification 6.1. The spec lists the
# names as examples and allows manual assignment; ADR-0016 freezes the concrete
# precedence and thresholds below as the reproducible MVP taxonomy. Future,
# more granular taxonomies require a new ADR and a version bump.
#
# Feature vocabulary the classifier provides (see state_cluster.py):
#   max_suit_count    int  largest number of board cards sharing one suit
#   max_window_ranks  int  most distinct board ranks in any 5-rank window
#                          (wheel-aware): 4+ => made/one-card straight board,
#                          3 => "three to a straight" (connected)
#   is_paired         bool some rank appears on the board >= 2 times
#   top_rank          int  highest board rank (2..14, ace high)
#
# Constraint keys allowed in `when` (all must hold; AND):
#   min_suit_count, min_window_ranks, min_top_rank, max_top_rank (integer bounds)
#   is_paired                                                    (boolean equality)

cluster_def_version: "0.1.0"
description: >
  Frozen MVP River board-texture clusters. Precedence: flush texture, then
  straight board, then paired, then unpaired high-and-connected, then low, with
  a dry high-card fallback. Future refinements require a new ADR and version bump.

clusters:
  - name: river_flush_complete
    when:
      min_suit_count: 3
  - name: river_straight_complete
    when:
      min_window_ranks: 4
  - name: river_paired_board
    when:
      is_paired: true
  - name: river_high_connected
    when:
      min_top_rank: 10
      min_window_ranks: 3
  - name: river_low_disconnected
    when:
      max_top_rank: 9
  - name: river_dry_high_card
    when: {}
