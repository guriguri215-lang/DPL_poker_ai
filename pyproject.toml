[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "poker-xai"
version = "0.1.0a14"
description = "Early-alpha simulation framework for auditable poker decision provenance, bounded CFR experiments, synthetic leaks, and explanation checks"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "poker-xai contributors" }]
keywords = ["poker", "explainable-ai", "opponent-modeling", "game-theory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic==2.11.7",
    "pyyaml==6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "ruff==0.12.9",
    "jsonschema==4.25.1",
    "setuptools==83.0.0",
]

[project.scripts]
poker-xai-export-schemas = "poker_core.schema_export:main"
poker-xai-gate-b-v2 = "gate_b_v2_launcher:main"
poker-xai-run-session = "poker_ai.run_session_cli:main"
poker-xai-verify-explanation-bundle = "poker_ai.explanation_bundle_cli:main"

[tool.setuptools]
include-package-data = false
py-modules = ["gate_b_v2_launcher", "gate_b_v2_startup"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
poker_core = ["*.yaml"]
poker_ai = ["*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
