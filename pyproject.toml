[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "poker-xai"
version = "0.0.0"
description = "Experimental Python framework for auditable poker decision provenance, small-game and river solving, synthetic opponent leaks, and explanation checks"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "poker-xai contributors" }]
keywords = ["poker", "explainable-ai", "opponent-modeling", "game-theory"]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "jsonschema>=4.0",
]

[project.scripts]
poker-xai-export-schemas = "poker_core.schema_export:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
poker_core = ["*.yaml"]
poker_ai = ["*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
