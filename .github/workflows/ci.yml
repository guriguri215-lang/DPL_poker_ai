name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_PYTHON_VERSION_WARNING: "1"

jobs:
  test-ubuntu:
    name: Ubuntu / Python 3.12.10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python 3.12.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.10"
          cache: pip
      - name: Create virtual environment
        run: python -m venv --copies .venv
      - name: Install pinned dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip==25.2
          .venv/bin/python -m pip install -e ".[dev]"
      - name: Lint
        run: .venv/bin/python -m ruff check . --no-cache
      - name: Format check
        run: .venv/bin/python -m ruff format --check --diff .
      - name: Full pytest
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: .venv/bin/python -m pytest -p no:cacheprovider
      - name: Offline no-index packaging
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          .venv/bin/python -m pytest -p no:cacheprovider
          tests/phase6/test_gate_b_v2_packaging.py::test_console_metadata_survives_isolated_offline_target_install

  test-windows:
    name: Windows / Python 3.12.10
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python 3.12.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.10"
          cache: pip
      - name: Create virtual environment
        shell: pwsh
        run: python -m venv --copies .venv
      - name: Install pinned dependencies
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pip install --upgrade pip==25.2
          .\.venv\Scripts\python.exe -m pip install -e ".[dev]"
      - name: Lint
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m ruff check . --no-cache
      - name: Format check
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m ruff format --check --diff .
      - name: Exact-startup Gate B v2 suite
        shell: pwsh
        run: |
          $python = (Resolve-Path .\.venv\Scripts\python.exe).Path
          $env:PYTHONDONTWRITEBYTECODE = "1"
          $env:PYTHONNOUSERSITE = "1"
          $env:PYTHONSAFEPATH = "1"
          $env:PYTHONPYCACHEPREFIX = $python
          $env:PYTHONPATH = (Resolve-Path .\src).Path
          $env:PYTEST_DISABLE_PLUGIN_AUTOLOAD = "1"
          & $python -S -B -P -s -X "pycache_prefix=$python" -c "import gate_b_v2_startup as startup; startup.bootstrap_gate_b_v2_source_only_startup(); import pytest; raise SystemExit(pytest.main(['-p','no:cacheprovider','tests/phase6/test_gate_b_loader.py','tests/phase6/test_gate_b_v2_route.py','tests/phase6/test_gate_b_v2_cli.py','tests/phase6/test_gate_b_v2_packaging.py']))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Full pytest under exact startup
        shell: pwsh
        run: |
          $python = (Resolve-Path .\.venv\Scripts\python.exe).Path
          $env:PYTHONDONTWRITEBYTECODE = "1"
          $env:PYTHONNOUSERSITE = "1"
          $env:PYTHONSAFEPATH = "1"
          $env:PYTHONPYCACHEPREFIX = $python
          $env:PYTHONPATH = (Resolve-Path .\src).Path
          $env:PYTEST_DISABLE_PLUGIN_AUTOLOAD = "1"
          & $python -S -B -P -s -X "pycache_prefix=$python" -c "import gate_b_v2_startup as startup; startup.bootstrap_gate_b_v2_source_only_startup(); import pytest; raise SystemExit(pytest.main(['-p','no:cacheprovider']))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Offline no-index packaging under exact startup
        shell: pwsh
        run: |
          $python = (Resolve-Path .\.venv\Scripts\python.exe).Path
          $env:PYTHONDONTWRITEBYTECODE = "1"
          $env:PYTHONNOUSERSITE = "1"
          $env:PYTHONSAFEPATH = "1"
          $env:PYTHONPYCACHEPREFIX = $python
          $env:PYTHONPATH = (Resolve-Path .\src).Path
          $env:PYTEST_DISABLE_PLUGIN_AUTOLOAD = "1"
          & $python -S -B -P -s -X "pycache_prefix=$python" -c "import gate_b_v2_startup as startup; startup.bootstrap_gate_b_v2_source_only_startup(); import pytest; raise SystemExit(pytest.main(['-p','no:cacheprovider','tests/phase6/test_gate_b_v2_packaging.py::test_console_metadata_survives_isolated_offline_target_install']))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
